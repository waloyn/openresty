name: Windows build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows ${{ matrix.host_arch }} host
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - host_arch: x86_64
            runner: windows-2022
            msystem: MINGW64
            toolchain: mingw-w64-x86_64-toolchain
          - host_arch: arm64
            runner: windows-11-arm
            msystem: MINGW64
            toolchain: mingw-w64-x86_64-toolchain

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            base-devel
            dos2unix
            git
            make
            mercurial
            patch
            perl
            unzip
            wget
            zip
            ${{ matrix.toolchain }}

      - name: Create source bundle
        run: |
          set -euo pipefail
          bash util/mirror-tarballs

      - name: Build OpenResty
        run: |
          set -euo pipefail

          echo "=== MSYS2 environment ==="
          uname -a
          echo "MSYSTEM=$MSYSTEM"

          VERSION="$(./util/ver)"

          if [ -z "$VERSION" ]; then
            echo "::error::Failed to determine OpenResty version"
            exit 1
          fi

          SRC_DIR="openresty-$VERSION"

          if [ ! -d "$SRC_DIR" ]; then
            echo "::error::Source directory not found: $SRC_DIR"
            exit 1
          fi

          cd "$SRC_DIR"

          bash ./util/build-win32.sh

          if [ ! -f nginx.exe ]; then
            echo "::error::nginx.exe was not generated"
            exit 1
          fi

          echo "=== Nginx version ==="
          ./nginx.exe -V 2>&1

      - name: Create official-style runnable bundle
        run: |
          set -euo pipefail

          # Resolve paths using the current MSYS2 shell.
          WORKSPACE="$(pwd -P)"
          VERSION="$(./util/ver)"

          if [ -z "$VERSION" ]; then
            echo "::error::Failed to determine OpenResty version"
            exit 1
          fi

          BUNDLE_NAME="openresty-${VERSION}-windows-${{ matrix.host_arch }}"
          SRC_DIR="$WORKSPACE/openresty-$VERSION"
          BUNDLE_ROOT="/tmp/$BUNDLE_NAME"
          ZIP_PATH="$WORKSPACE/$BUNDLE_NAME.zip"

          # Verify the source directory.
          if [ ! -d "$SRC_DIR" ]; then
            echo "::error::Build directory not found: $SRC_DIR"
            exit 1
          fi

          cd "$SRC_DIR"

          # Verify essential build outputs.
          required_files=(
            nginx.exe
            luajit.exe
            conf
            html
          )

          for item in "${required_files[@]}"; do
            if [ ! -e "$item" ]; then
              echo "::error::Required build output is missing: $item"
              exit 1
            fi
          done

          # Never create output inside the source tree.
          rm -rf "$BUNDLE_ROOT"
          rm -f "$ZIP_PATH"

          mkdir -p "$BUNDLE_ROOT/logs"

          # Copy runtime files.
          for item in \
            nginx.exe \
            lua \
            luajit.exe \
            resty \
            resty.bat \
            restydoc \
            restydoc-index \
            restydoc-index.bat \
            restydoc.bat \
            conf \
            html \
            logs \
            pod \
            include \
            lib \
            lualib \
            README.txt \
            COPYRIGHT
          do
            if [ -e "$item" ]; then
              cp -a "$item" "$BUNDLE_ROOT/"
            fi
          done

          # Copy DLLs referenced by nginx.exe.
          for d in /mingw64/bin /ucrt64/bin /usr/bin; do
            [ -d "$d" ] || continue

            while IFS= read -r -d '' dll; do
              base="$(basename "$dll")"

              if ldd ./nginx.exe 2>/dev/null | grep -q "$base"; then
                cp -f "$dll" "$BUNDLE_ROOT/"
              fi
            done < <(
              find "$d" -maxdepth 1 -type f -iname '*.dll' -print0
            )
          done

          # Helper scripts.
          cat > "$BUNDLE_ROOT/start.bat" <<'EOF'
          @echo off
          set "ROOT=%~dp0"
          "%ROOT%nginx.exe" -p "%ROOT%"
          EOF

          cat > "$BUNDLE_ROOT/stop.bat" <<'EOF'
          @echo off
          set "ROOT=%~dp0"
          "%ROOT%nginx.exe" -s quit -p "%ROOT%"
          EOF

          # Ensure the logs directory exists.
          mkdir -p "$BUNDLE_ROOT/logs"

          # Create ZIP using an absolute POSIX path.
          cd /tmp
          zip -r "$ZIP_PATH" "$BUNDLE_NAME"

          # Verify archive integrity.
          if [ ! -s "$ZIP_PATH" ]; then
            echo "::error::ZIP archive was not created or is empty"
            exit 1
          fi

          unzip -t "$ZIP_PATH"

          echo "=== Archive contents ==="
          unzip -Z1 "$ZIP_PATH"

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: openresty-windows-${{ matrix.host_arch }}-official
          path: openresty-*-windows-${{ matrix.host_arch }}.zip
          if-no-files-found: error
