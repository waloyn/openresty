name: Windows build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows ${{ matrix.host_arch }} host
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - host_arch: x86_64
            runner: windows-2022
            msystem: MINGW64
            toolchain: mingw-w64-x86_64-toolchain
          - host_arch: arm64
            runner: windows-11-arm
            msystem: MINGW64
            toolchain: mingw-w64-x86_64-toolchain

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            base-devel
            dos2unix
            git
            make
            mercurial
            patch
            perl
            unzip
            wget
            zip
            ${{ matrix.toolchain }}

      - name: Create source bundle
        run: bash util/mirror-tarballs

      - name: Build OpenResty
        run: |
          uname -a
          cd "openresty-$(./util/ver)"
          bash ./util/build-win32.sh
          ./nginx.exe -V 2>&1

      - name: Create official-style runnable bundle
        run: |
          set -e

          SRC_DIR="openresty-$(./util/ver)"
          BUNDLE_NAME="openresty-$(./util/ver)-windows-${{ matrix.host_arch }}"
          BUNDLE_ROOT="/tmp/${BUNDLE_NAME}"
          ZIP_PATH="${SRC_DIR}/${BUNDLE_NAME}.zip"

          cd "$SRC_DIR"

          # Build bundle outside the source tree to avoid self-copy recursion.
          rm -rf "$BUNDLE_ROOT"
          mkdir -p "$BUNDLE_ROOT/logs"

          # Runtime files expected in a normal Windows OpenResty distribution.
          for item in \
            nginx.exe \
            lua \
            luajit.exe \
            resty \
            resty.bat \
            restydoc \
            restydoc-index \
            restydoc-index.bat \
            restydoc.bat \
            conf \
            html \
            logs \
            pod \
            include \
            lib \
            lualib \
            README.txt \
            COPYRIGHT
          do
            if [ -e "$item" ]; then
              cp -a "$item" "$BUNDLE_ROOT/"
            fi
          done

          # Include required DLLs next to the executable.
          for d in /mingw64/bin /ucrt64/bin /usr/bin; do
            [ -d "$d" ] || continue
            for dll in $(find "$d" -maxdepth 1 -type f -name '*.dll' 2>/dev/null); do
              base=$(basename "$dll")
              if ldd ./nginx.exe 2>/dev/null | grep -q "$base"; then
                cp -f "$dll" "$BUNDLE_ROOT/"
              fi
            done
          done

          # Start/stop helpers for direct execution after unzip.
          cat > "$BUNDLE_ROOT/start.bat" <<'EOF'
          @echo off
          set "ROOT=%~dp0"
          "%ROOT%nginx.exe" -p "%ROOT%"
          EOF

          cat > "$BUNDLE_ROOT/stop.bat" <<'EOF'
          @echo off
          set "ROOT=%~dp0"
          "%ROOT%nginx.exe" -s quit -p "%ROOT%"
          EOF

          # Ensure logs dir exists and is writable.
          mkdir -p "$BUNDLE_ROOT/logs"

          # Package from /tmp so zip is not created inside the bundle.
          cd /tmp
          zip -r "$ZIP_PATH" "$BUNDLE_NAME"

          echo "ARTIFACT_PATH=$ZIP_PATH" >> "$GITHUB_ENV"

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: openresty-windows-${{ matrix.host_arch }}-official
          path: ${{ env.ARTIFACT_PATH }}
          if-no-files-found: error
