name: Windows build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows ${{ matrix.host_arch }} host
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - host_arch: x86_64
            runner: windows-2022
            msystem: MINGW64
            toolchain: mingw-w64-x86_64-toolchain
          - host_arch: arm64
            runner: windows-11-arm
            msystem: MINGW64
            toolchain: mingw-w64-x86_64-toolchain

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            base-devel
            dos2unix
            git
            make
            mercurial
            patch
            perl
            unzip
            wget
            zip
            ${{ matrix.toolchain }}

      - name: Create source bundle
        run: bash util/mirror-tarballs

      - name: Build OpenResty
        run: |
          uname -a
          cd "openresty-$(./util/ver)"
          bash ./util/build-win32.sh
          ./nginx.exe -V 2>&1

      - name: Package runnable Windows bundle
        shell: bash
        run: |
          set -e

          SRC_DIR="openresty-$(./util/ver)"
          DIST_NAME="openresty-windows-${{ matrix.host_arch }}-run"
          DIST_ROOT="/tmp/${DIST_NAME}"

          cd "$SRC_DIR"

          # Always build bundle outside the source tree. Never copy the bundle into itself.
          rm -rf "$DIST_ROOT"
          mkdir -p "$DIST_ROOT/logs"

          # Copy only the runtime files that are required to run the binary.
          # This avoids recursive copy issues from copying the whole source tree into dist.
          for item in \
            nginx.exe \
            lua \
            luajit.exe \
            resty \
            resty.bat \
            restydoc \
            restydoc-index \
            restydoc-index.bat \
            restydoc.bat \
            conf \
            html \
            logs \
            pod \
            include \
            lib \
            lualib \
            README.txt \
            COPYRIGHT
          do
            if [ -e "$item" ]; then
              cp -a "$item" "$DIST_ROOT/"
            fi
          done

          # Ensure runtime DLLs are available next to nginx.exe.
          for d in /mingw64/bin /ucrt64/bin /usr/bin; do
            [ -d "$d" ] || continue
            for dll in $(find "$d" -maxdepth 1 -type f -name '*.dll' 2>/dev/null); do
              base=$(basename "$dll")
              if ldd ./nginx.exe 2>/dev/null | grep -q "$base"; then
                cp -f "$dll" "$DIST_ROOT/"
              fi
            done
          done

          # Create startup helpers for direct execution after unzip.
          cat > "$DIST_ROOT/start.bat" <<'EOF'
          @echo off
          set "ROOT=%~dp0"
          "%ROOT%nginx.exe" -p "%ROOT%"
          EOF

          cat > "$DIST_ROOT/stop.bat" <<'EOF'
          @echo off
          set "ROOT=%~dp0"
          "%ROOT%nginx.exe" -s quit -p "%ROOT%"
          EOF

          # Zip from the parent directory so the zip itself is not inside the bundle.
          cd /tmp
          zip -r "${SRC_DIR}/${DIST_NAME}.zip" "${DIST_NAME}"

          echo "ARTIFACT_PATH=${SRC_DIR}/${DIST_NAME}.zip" >> "$GITHUB_ENV"

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: openresty-windows-${{ matrix.host_arch }}-run
          path: ${{ env.ARTIFACT_PATH }}
          if-no-files-found: error
